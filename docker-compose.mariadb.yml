# MariaDB variant
# Usage: docker compose -f docker-compose.mariadb.yml up -d

services:
  app:
    image: ghcr.io/adityadarma/laravel-reverb-server:${APP_IMAGE_TAG:-latest}
    container_name: reverb-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${REVERB_SERVER_PORT:-8080}:8080"
    env_file:
      - .env.mariadb.example
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-reverb}
      DB_USERNAME: ${DB_USERNAME:-reverb}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: mariadb:10.11
    container_name: reverb-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_DATABASE: ${DB_DATABASE:-reverb}
      MARIADB_USER: ${DB_USERNAME:-reverb}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-storage:
  db-data:
