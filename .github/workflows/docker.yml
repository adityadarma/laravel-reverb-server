name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Runs on every push to main/master ────────────────────────────────────────
  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=dev
            GITHUB_REPOSITORY=${{ github.repository }}

  # ── Runs only on version tags (v*.*.*) ───────────────────────────────────────
  build-release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            GITHUB_REPOSITORY=${{ github.repository }}

  # ── GitHub Release — only on version tags ────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          CURRENT_TAG=${GITHUB_REF_NAME}

          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md

          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: \`$PREV_TAG\` → \`$CURRENT_TAG\`" >> changelog.md
            echo "" >> changelog.md

            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -iE '^- (feat|feature)' || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -iE '^- (fix|bug)' || true)
            OTHERS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -ivE '^- (feat|feature|fix|bug)' || true)

            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features" >> changelog.md
              echo "$FEATURES" >> changelog.md
              echo "" >> changelog.md
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes" >> changelog.md
              echo "$FIXES" >> changelog.md
              echo "" >> changelog.md
            fi

            if [ -n "$OTHERS" ]; then
              echo "### 🔧 Other Changes" >> changelog.md
              echo "$OTHERS" >> changelog.md
              echo "" >> changelog.md
            fi
          else
            echo "Initial release 🎉" >> changelog.md
          fi

          echo "" >> changelog.md
          echo "### 🐳 Docker Image" >> changelog.md
          echo '```' >> changelog.md
          echo "# Pull specific version" >> changelog.md
          echo "docker pull ghcr.io/${{ github.repository }}:${{ needs.build-release.outputs.version }}" >> changelog.md
          echo "" >> changelog.md
          echo "# Or use in docker-compose.yml" >> changelog.md
          echo "APP_IMAGE_TAG=${{ needs.build-release.outputs.version }} docker compose up -d" >> changelog.md
          echo '```' >> changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
