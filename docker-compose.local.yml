# Local development — builds image from source
# Usage: docker compose -f docker-compose.local.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: local
        GITHUB_REPOSITORY: local/laravel-reverb-server
    image: laravel-reverb-server:local
    container_name: reverb-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - .env:/var/www/html/.env
      - app-storage:/var/www/html/storage
      - app-database:/var/www/html/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-storage:
  app-database:
