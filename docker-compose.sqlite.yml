# Default: SQLite (simplest, no external DB needed)
# Usage: docker compose up -d

services:
  app:
    image: ghcr.io/adityadarma/laravel-reverb-server:${APP_IMAGE_TAG:-latest}
    container_name: reverb-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${REVERB_SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
      - app-database:/var/www/html/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-storage:
  app-database:
