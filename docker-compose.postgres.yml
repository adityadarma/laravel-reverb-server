# PostgreSQL variant
# Usage: docker compose -f docker-compose.postgres.yml up -d

services:
  app:
    image: ghcr.io/adityadarma/laravel-reverb-server:${APP_IMAGE_TAG:-latest}
    container_name: reverb-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - .env:/var/www/html/.env
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: reverb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reverb}
      POSTGRES_USER: ${DB_USERNAME:-reverb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reverb} -d ${DB_DATABASE:-reverb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-storage:
  db-data:
